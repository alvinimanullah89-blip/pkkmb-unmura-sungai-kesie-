<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>PKKMB UNMURA 2026</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:14px;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

h2{
  text-align:center;
  margin:4px 0 12px;
  font-size:21px;
}

.panel{
  max-width:560px;
  margin:0 auto 12px;
  background:#222;
  border-radius:14px;
  padding:14px;
}

.group{
  margin-bottom:12px;
}

.group label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin-bottom:5px;
}

input[type="text"]{
  width:100%;
  padding:11px 12px;
  border:1px solid #555;
  border-radius:9px;
  background:#111;
  color:#fff;
  font-size:16px;
}

input[type="file"]{
  width:100%;
  font-size:15px;
  margin-bottom:8px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  width:100%;
  margin-top:8px;
  background:#f3c400;
  color:#111;
}

.secondary{
  background:#444;
  color:#fff;
  width:100%;
}

.range{
  margin-top:10px;
}

.range label{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:3px;
}

input[type="range"]{
  width:100%;
}

.hint{
  font-size:12px;
  color:#bbb;
  margin:7px 0 0;
  line-height:1.4;
}

canvas{
  display:block;
  width:100%;
  max-width:560px;
  height:auto;
  margin:10px auto 20px;
  border-radius:10px;
  touch-action:none;
}
</style>
</head>

<body>

<h2>PKKMB UNMURA 2026</h2>

<div class="panel">

  <!-- FOTO -->
  <div class="group">
    <label>Foto</label>
    <input id="foto" type="file" accept="image/*">
  </div>

  <!-- NAMA -->
  <div class="group">
    <label>Nama</label>
    <input
      id="nama"
      type="text"
      value="alvin imanullah"
      maxlength="34">
  </div>

  <!-- SEKOLAH -->
  <div class="group">
    <label>Asal Sekolah</label>
    <input
      id="sekolah"
      type="text"
      value="Sma Nusa Lubuklinggau"
      maxlength="42">
  </div>

  <!-- PRODI -->
  <div class="group">
    <label>Prodi</label>
    <input
      id="prodi"
      type="text"
      value="Ilmu Komputer"
      maxlength="34">
  </div>

  <!-- REGU -->
  <div class="group">
    <label>Nama Regu</label>
    <input
      id="regu"
      type="text"
      value="Sungai Kesie"
      maxlength="30">
  </div>

  <!-- KONTROL FOTO -->
  <div id="kontrol" style="display:none">

    <div class="range">
      <label>
        <span>Zoom foto</span>
        <span id="zoomVal">1.00×</span>
      </label>

      <input
        id="zoom"
        type="range"
        min="0.50"
        max="2.50"
        step="0.01"
        value="1">
    </div>

    <div class="range">
      <label>
        <span>Kiri / kanan</span>
        <span id="xVal">0</span>
      </label>

      <input
        id="geserX"
        type="range"
        min="-350"
        max="350"
        value="0">
    </div>

    <div class="range">
      <label>
        <span>Atas / bawah</span>
        <span id="yVal">0</span>
      </label>

      <input
        id="geserY"
        type="range"
        min="-350"
        max="350"
        value="0">
    </div>

    <p class="hint">
      Foto bisa langsung digeser menggunakan jari pada gambar.
      Gunakan Zoom untuk memperbesar atau mengecilkan foto.
    </p>

  </div>

  <div class="row">

    <button
      class="secondary"
      onclick="resetFoto()">
      Reset Foto
    </button>

    <button
      class="primary"
      onclick="downloadPNG()">
      Download PNG
    </button>

  </div>

</div>

<canvas
  id="canvas"
  width="1024"
  height="1536">
</canvas>


<script>

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");


const fotoInput =
  document.getElementById("foto");

const kontrol =
  document.getElementById("kontrol");

const zoomInput =
  document.getElementById("zoom");

const geserX =
  document.getElementById("geserX");

const geserY =
  document.getElementById("geserY");

const zoomVal =
  document.getElementById("zoomVal");

const xVal =
  document.getElementById("xVal");

const yVal =
  document.getElementById("yVal");


const fields = {

  nama:
    document.getElementById("nama"),

  sekolah:
    document.getElementById("sekolah"),

  prodi:
    document.getElementById("prodi"),

  regu:
    document.getElementById("regu")

};


const template =
  new Image();

template.src =
  "8B740CBE-CECD-44A7-A31E-067C7C106C3D.png";


let foto =
  new Image();

let fotoAda =
  false;


let dragging =
  false;

let lastX =
  0;

let lastY =
  0;


/*
==================================================
AREA FOTO
==================================================

Bagian ini yang menentukan posisi foto.

Sudah dibuat lebih besar dari versi sebelumnya.
==================================================
*/

const areaFoto = {

  x:236,

  y:350,

  width:520,

  height:650

};


template.onload =
  function(){

    gambar();

  };


/*
==================================================
PILIH FOTO
==================================================
*/

fotoInput.addEventListener(
  "change",

  function(e){

    const file =
      e.target.files[0];

    if(!file)
      return;


    foto.onload =
      function(){

        fotoAda =
          true;

        kontrol.style.display =
          "block";

        gambar();

      };


    foto.src =
      URL.createObjectURL(file);

  }
);


/*
==================================================
INPUT TEKS
==================================================
*/

Object.values(fields)
.forEach(function(el){

  el.addEventListener(
    "input",
    gambar
  );

});


/*
==================================================
KONTROL FOTO
==================================================
*/

[
  zoomInput,
  geserX,
  geserY
]
.forEach(function(el){

  el.addEventListener(
    "input",
    function(){

      updateLabels();

      gambar();

    }
  );

});


function updateLabels(){

  zoomVal.textContent =
    Number(
      zoomInput.value
    ).toFixed(2)
    + "×";


  xVal.textContent =
    geserX.value;


  yVal.textContent =
    geserY.value;

}


/*
==================================================
TULIS DATA DI KERTAS
==================================================
*/

function drawText(){

  /*
  Tutup tulisan lama.
  Hanya bagian nilai yang ditutup,
  label sebelah kiri tetap aman.
  */

  ctx.fillStyle =
    "rgba(247,246,240,0.98)";


  ctx.fillRect(
    350,
    1070,
    650,
    48
  );


  ctx.fillRect(
    350,
    1110,
    650,
    50
  );


  ctx.fillRect(
    350,
    1155,
    650,
    48
  );


  ctx.fillRect(
    350,
    1200,
    650,
    48
  );


  /*
  NAMA
  */

  ctx.fillStyle =
    "#171717";

  ctx.textBaseline =
    "middle";

  ctx.font =
    "700 28px Arial";

  ctx.fillText(
    fields.nama.value,
    372,
    1095
  );


  /*
  SEKOLAH
  */

  ctx.font =
    "700 27px Arial";

  ctx.fillText(
    fields.sekolah.value,
    372,
    1142
  );


  /*
  PRODI
  */

  ctx.font =
    "700 28px Arial";

  ctx.fillText(
    fields.prodi.value,
    372,
    1188
  );


  /*
  REGU
  */

  ctx.font =
    "700 28px Arial";

  ctx.fillText(
    fields.regu.value,
    372,
    1235
  );

}


/*
==================================================
GAMBAR CANVAS
==================================================
*/

function gambar(){

  ctx.clearRect(
    0,
    0,
    1024,
    1536
  );


  /*
  TEMPLATE
  */

  if(template.complete){

    ctx.drawImage(
      template,
      0,
      0,
      1024,
      1536
    );

  }


  /*
  FOTO
  */

  if(fotoAda){

    ctx.save();


    /*
    BATASI FOTO DI DALAM FRAME
    */

    ctx.beginPath();

    ctx.rect(
      areaFoto.x,
      areaFoto.y,
      areaFoto.width,
      areaFoto.height
    );

    ctx.clip();


    /*
    HITUNG SKALA
    */

    const dasar =
      Math.max(

        areaFoto.width /
        foto.width,

        areaFoto.height /
        foto.height

      );


    const skala =
      dasar *
      Number(
        zoomInput.value
      );


    const w =
      foto.width *
      skala;


    const h =
      foto.height *
      skala;


    /*
    POSISI FOTO
    */

    const x =
      areaFoto.x +
      (
        areaFoto.width -
        w
      ) / 2
      +
      Number(
        geserX.value
      );


    const y =
      areaFoto.y +
      (
        areaFoto.height -
        h
      ) / 2
      +
      Number(
        geserY.value
      );


    ctx.drawImage(
      foto,
      x,
      y,
      w,
      h
    );


    ctx.restore();

  }


  /*
  DATA NAMA / SEKOLAH / PRODI / REGU
  */

  drawText();

}


/*
==================================================
RESET FOTO
==================================================
*/

function resetFoto(){

  zoomInput.value =
    1;

  geserX.value =
    0;

  geserY.value =
    0;


  updateLabels();

  gambar();

}


/*
==================================================
GESER FOTO PAKAI JARI
==================================================
*/

canvas.addEventListener(
  "pointerdown",

  function(e){

    if(!fotoAda)
      return;


    dragging =
      true;


    canvas.setPointerCapture(
      e.pointerId
    );


    lastX =
      e.clientX;

    lastY =
      e.clientY;

  }
);


canvas.addEventListener(
  "pointermove",

  function(e){

    if(!dragging)
      return;


    const rect =
      canvas.getBoundingClientRect();


    const sx =
      1024 /
      rect.width;


    const sy =
      1536 /
      rect.height;


    const dx =
      (
        e.clientX -
        lastX
      ) * sx;


    const dy =
      (
        e.clientY -
        lastY
      ) * sy;


    geserX.value =
      Math.max(

        -350,

        Math.min(

          350,

          Number(
            geserX.value
          ) + dx

        )

      );


    geserY.value =
      Math.max(

        -350,

        Math.min(

          350,

          Number(
            geserY.value
          ) + dy

        )

      );


    lastX =
      e.clientX;

    lastY =
      e.clientY;


    updateLabels();

    gambar();

  }
);


canvas.addEventListener(
  "pointerup",

  function(){

    dragging =
      false;

  }
);


canvas.addEventListener(
  "pointercancel",

  function(){

    dragging =
      false;

  }
);


/*
==================================================
DOWNLOAD
==================================================
*/

function downloadPNG(){

  const link =
    document.createElement(
      "a"
    );


  const namaFile =
    (
      fields.nama.value ||
      "Nama"
    )
    .replace(
      /\s+/g,
      "_"
    );


  link.download =
    "PKKMB_UNMURA_2026_"
    + namaFile
    + ".png";


  link.href =
    canvas.toDataURL(
      "image/png"
    );


  link.click();

}


updateLabels();

</script>

</body>
</html>
