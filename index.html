<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Editor Name Tag PKKMB 2026</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101b14;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  margin:5px 0 20px;
  font-size:25px;
}

.editor{
  background:#17251c;
  padding:18px;
  border-radius:15px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:5px;
  font-weight:bold;
}

input[type=text],
input[type=file]{
  width:100%;
  padding:11px;
  border-radius:8px;
  border:1px solid #526358;
  background:#0e1712;
  color:white;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.control{
  margin-top:12px;
}

.control-title{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:5px;
}

input[type=range]{
  width:100%;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

button{
  border:0;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.reset{
  background:#555;
  color:white;
}

.download{
  background:#e4bd24;
  color:#111;
}

.canvas-wrap{
  margin-top:20px;
  background:#080d0a;
  padding:12px;
  border-radius:15px;
  text-align:center;
}

canvas{
  width:100%;
  max-width:600px;
  height:auto;
  display:block;
  margin:auto;
  touch-action:none;
  border-radius:5px;
}

.info{
  font-size:13px;
  opacity:.75;
  text-align:center;
  margin-top:10px;
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr;
  }

  .container{
    padding:10px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>EDITOR NAME TAG PKKMB 2026</h1>

<div class="editor">

<div class="row">

<div>
<label>Nama</label>
<input id="nama" type="text" value="alvin imanullah">
</div>

<div>
<label>Asal Sekolah</label>
<input id="sekolah" type="text" value="Sma Nusa Lubuklinggau">
</div>

<div>
<label>Prodi</label>
<input id="prodi" type="text" value="Ilmu Komputer">
</div>

<div>
<label>Nama Regu</label>
<input id="regu" type="text" value="Sungai Kesie">
</div>

</div>

<label>Foto</label>
<input id="fotoInput" type="file" accept="image/*">

<div class="control">
  <div class="control-title">
    <span>Zoom Foto</span>
    <span id="zoomValue">1.00</span>
  </div>
  <input id="zoom" type="range" min="0.50" max="2.50" step="0.01" value="1">
</div>

<div class="control">
  <div class="control-title">
    <span>Kiri / Kanan</span>
    <span id="xValue">0</span>
  </div>
  <input id="offsetX" type="range" min="-350" max="350" value="0">
</div>

<div class="control">
  <div class="control-title">
    <span>Atas / Bawah</span>
    <span id="yValue">0</span>
  </div>
  <input id="offsetY" type="range" min="-350" max="350" value="0">
</div>

<div class="buttons">
  <button class="reset" onclick="resetFoto()">Reset Foto</button>
  <button class="download" onclick="downloadPNG()">Download PNG</button>
</div>

</div>

<div class="canvas-wrap">
<canvas id="canvas" width="1024" height="1536"></canvas>
</div>

<div class="info">
Geser foto langsung di gambar atau gunakan slider.
</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const namaInput = document.getElementById("nama");
const sekolahInput = document.getElementById("sekolah");
const prodiInput = document.getElementById("prodi");
const reguInput = document.getElementById("regu");

const fotoInput = document.getElementById("fotoInput");

const zoomSlider = document.getElementById("zoom");
const offsetXSlider = document.getElementById("offsetX");
const offsetYSlider = document.getElementById("offsetY");

const zoomValue = document.getElementById("zoomValue");
const xValue = document.getElementById("xValue");
const yValue = document.getElementById("yValue");


/* =========================================================
   TEMPLATE
========================================================= */

const template = new Image();

template.src =
  "8B740CBE-CECD-44A7-A31E-067C7C106C3D.png";

template.onerror = function(){

  /* fallback apabila file yang tersimpan adalah JPEG */

  template.src =
    "8B740CBE-CECD-44A7-A31E-067C7C106C3D(3).jpeg";

};

template.onload = function(){
  draw();
};


/* =========================================================
   FOTO USER
========================================================= */

const userPhoto = new Image();

let hasPhoto = false;

let photoX = 0;
let photoY = 0;
let photoZoom = 1;


/*
   Area bagian DALAM foto.
   Bingkai asli akan digambar kembali setelah foto.
*/

const photoArea = {
  x: 267,
  y: 315,
  width: 490,
  height: 650
};


/*
   Area luar bingkai.
   Dipakai untuk mengembalikan bingkai/tape/
   pinggiran kertas asli setelah foto digambar.
*/

const frameArea = {
  x: 235,
  y: 275,
  width: 555,
  height: 735
};


/* =========================================================
   INPUT FOTO
========================================================= */

fotoInput.addEventListener("change", function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(event){

    userPhoto.onload = function(){

      hasPhoto = true;

      resetFoto();

    };

    userPhoto.src = event.target.result;

  };

  reader.readAsDataURL(file);

});


/* =========================================================
   TEXT INPUT
========================================================= */

[
  namaInput,
  sekolahInput,
  prodiInput,
  reguInput
].forEach(input => {

  input.addEventListener("input", draw);

});


/* =========================================================
   SLIDER
========================================================= */

zoomSlider.addEventListener("input", function(){

  photoZoom = Number(this.value);

  zoomValue.textContent = photoZoom.toFixed(2);

  draw();

});


offsetXSlider.addEventListener("input", function(){

  photoX = Number(this.value);

  xValue.textContent = photoX;

  draw();

});


offsetYSlider.addEventListener("input", function(){

  photoY = Number(this.value);

  yValue.textContent = photoY;

  draw();

});


/* =========================================================
   RESET
========================================================= */

function resetFoto(){

  photoX = 0;
  photoY = 0;
  photoZoom = 1;

  zoomSlider.value = 1;
  offsetXSlider.value = 0;
  offsetYSlider.value = 0;

  zoomValue.textContent = "1.00";
  xValue.textContent = "0";
  yValue.textContent = "0";

  draw();

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  if(!template.complete || !template.naturalWidth){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    return;
  }


  /*
     1. TEMPLATE ASLI
  */

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.drawImage(
    template,
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
     2. FOTO USER
     Foto hanya boleh berada di area dalam frame.
  */

  if(hasPhoto && userPhoto.complete){

    drawPhoto();

  }


  /*
     3. KEMBALIKAN FRAME ASLI
     Ini bagian penting agar foto tidak terlihat ditempel.
  */

  restoreFrame();


  /*
     4. EDIT TEXT
  */

  drawText();

}


/* =========================================================
   DRAW FOTO
========================================================= */

function drawPhoto(){

  ctx.save();

  /*
     Clip hanya bagian dalam foto.
  */

  ctx.beginPath();

  ctx.rect(
    photoArea.x,
    photoArea.y,
    photoArea.width,
    photoArea.height
  );

  ctx.clip();


  /*
     Ukuran foto menyesuaikan cover.
  */

  const scale = Math.max(
    photoArea.width / userPhoto.width,
    photoArea.height / userPhoto.height
  ) * photoZoom;


  const drawWidth =
    userPhoto.width * scale;

  const drawHeight =
    userPhoto.height * scale;


  const centerX =
    photoArea.x +
    photoArea.width / 2 +
    photoX;

  const centerY =
    photoArea.y +
    photoArea.height / 2 +
    photoY;


  ctx.drawImage(
    userPhoto,

    centerX - drawWidth / 2,
    centerY - drawHeight / 2,

    drawWidth,
    drawHeight
  );


  ctx.restore();

}


/* =========================================================
   RESTORE FRAME
========================================================= */

function restoreFrame(){

  ctx.save();

  /*
     Buat area berbentuk:
     bingkai luar MINUS lubang foto.

     Dengan begitu hanya bingkai asli yang
     digambar ulang di atas foto.
  */

  ctx.beginPath();

  ctx.rect(
    frameArea.x,
    frameArea.y,
    frameArea.width,
    frameArea.height
  );

  ctx.rect(
    photoArea.x,
    photoArea.y,
    photoArea.width,
    photoArea.height
  );

  ctx.clip("evenodd");


  ctx.drawImage(
    template,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();

}


/* =========================================================
   PAPER PATCH
========================================================= */

function paperPatch(x,y,w,h){

  /*
     Mengambil tekstur kertas kosong dari
     bagian bawah panel template.

     Jadi bukan warna putih polos.
  */

  ctx.drawImage(
    template,

    390,
    1250,
    410,
    38,

    x,
    y,
    w,
    h
  );

}


/* =========================================================
   TEXT
========================================================= */

function drawText(){

  /*
     Tutup HANYA bagian nilai lama.

     Label:
     nama :
     asal sekolah :
     prodi :
     nama regu :

     tetap berasal dari template asli.
  */

  paperPatch(383,1028,435,42);
  paperPatch(383,1076,435,42);
  paperPatch(383,1124,435,42);
  paperPatch(383,1172,435,42);


  ctx.save();

  ctx.fillStyle = "#151515";

  /*
     Font dibuat mendekati karakter tulisan
     pada template.
  */

  ctx.font =
    '700 29px Arial, sans-serif';

  ctx.textBaseline = "middle";


  /*
     Nama
  */

  ctx.fillText(
    namaInput.value,
    394,
    1049
  );


  /*
     Asal sekolah
  */

  ctx.fillText(
    sekolahInput.value,
    394,
    1097
  );


  /*
     Prodi
  */

  ctx.fillText(
    prodiInput.value,
    394,
    1145
  );


  /*
     Nama regu
  */

  ctx.fillText(
    reguInput.value,
    394,
    1193
  );


  ctx.restore();

}


/* =========================================================
   DRAG FOTO
========================================================= */

let dragging = false;

let startPointerX = 0;
let startPointerY = 0;

let startPhotoX = 0;
let startPhotoY = 0;


function pointerPosition(e){

  const rect =
    canvas.getBoundingClientRect();

  const scaleX =
    canvas.width / rect.width;

  const scaleY =
    canvas.height / rect.height;

  let clientX;
  let clientY;

  if(e.touches){

    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;

  }else{

    clientX = e.clientX;
    clientY = e.clientY;

  }

  return {

    x:(clientX - rect.left) * scaleX,

    y:(clientY - rect.top) * scaleY

  };

}


/* mouse */

canvas.addEventListener("mousedown", function(e){

  if(!hasPhoto) return;

  const p = pointerPosition(e);

  dragging = true;

  startPointerX = p.x;
  startPointerY = p.y;

  startPhotoX = photoX;
  startPhotoY = photoY;

});


window.addEventListener("mousemove", function(e){

  if(!dragging) return;

  const p = pointerPosition(e);

  photoX =
    startPhotoX +
    (p.x - startPointerX);

  photoY =
    startPhotoY +
    (p.y - startPointerY);

  photoX =
    Math.max(-350,Math.min(350,photoX));

  photoY =
    Math.max(-350,Math.min(350,photoY));

  offsetXSlider.value = photoX;
  offsetYSlider.value = photoY;

  xValue.textContent =
    Math.round(photoX);

  yValue.textContent =
    Math.round(photoY);

  draw();

});


window.addEventListener("mouseup", function(){

  dragging = false;

});


/* =========================================================
   TOUCH
========================================================= */

canvas.addEventListener("touchstart", function(e){

  if(!hasPhoto) return;

  e.preventDefault();

  const p = pointerPosition(e);

  dragging = true;

  startPointerX = p.x;
  startPointerY = p.y;

  startPhotoX = photoX;
  startPhotoY = photoY;

},{passive:false});


canvas.addEventListener("touchmove", function(e){

  if(!dragging) return;

  e.preventDefault();

  const p = pointerPosition(e);

  photoX =
    startPhotoX +
    (p.x - startPointerX);

  photoY =
    startPhotoY +
    (p.y - startPointerY);

  photoX =
    Math.max(-350,Math.min(350,photoX));

  photoY =
    Math.max(-350,Math.min(350,photoY));

  offsetXSlider.value = photoX;
  offsetYSlider.value = photoY;

  xValue.textContent =
    Math.round(photoX);

  yValue.textContent =
    Math.round(photoY);

  draw();

},{passive:false});


canvas.addEventListener("touchend", function(){

  dragging = false;

});


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadPNG(){

  /*
     Pastikan gambar terakhir sudah dirender.
  */

  draw();

  const link =
    document.createElement("a");

  link.download =
    "PKKMB-2026-NameTag.png";

  link.href =
    canvas.toDataURL("image/png");

  link.click();

}


/* =========================================================
   INITIAL DRAW
========================================================= */

draw();

</script>

</body>
</html>
