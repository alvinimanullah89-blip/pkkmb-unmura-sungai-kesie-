<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Twibbon PKKMB 2026</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1200px;
            justify-content: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .canvas-container {
            position: relative;
            max-width: 100%;
            overflow: hidden;
            border: 2px dashed #ccc;
            border-radius: 8px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 600px;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        input[type="text"], input[type="file"], input[type="range"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-download {
            background-color: #28a745;
            margin-top: 10px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .info-box {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <div class="info-box">
        <strong>Penting:</strong> Pastikan file template Anda bernama <code>image.png</code> dan berada di satu folder dengan file ini. Bagian tengah template (tempat foto) harus sudah transparan agar foto dapat terlihat.
    </div>

    <div class="container">
        <!-- Panel Kontrol -->
        <div class="controls">
            <h3>Pengaturan Data & Foto</h3>
            
            <div class="input-group">
                <label>Unggah Foto Anda:</label>
                <input type="file" id="upload-photo" accept="image/png, image/jpeg, image/jpg">
            </div>

            <div class="input-group">
                <label>Ukuran Foto (Zoom):</label>
                <input type="range" id="scale-photo" min="0.1" max="3" step="0.01" value="1">
            </div>

            <div class="input-group">
                <label>Nama:</label>
                <input type="text" id="input-nama" placeholder="Masukkan Nama" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label>Asal Sekolah:</label>
                <input type="text" id="input-sekolah" placeholder="Masukkan Asal Sekolah" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label>Prodi:</label>
                <input type="text" id="input-prodi" placeholder="Masukkan Prodi" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label>Nama Regu:</label>
                <input type="text" id="input-regu" placeholder="Masukkan Nama Regu" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label>Ukuran Font Teks:</label>
                <input type="range" id="font-size" min="10" max="60" step="1" value="28">
            </div>

            <button class="btn btn-download" onclick="downloadImage()">Unduh Twibbon</button>
        </div>

        <!-- Area Preview Canvas -->
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Element Inputs
        const inputNama = document.getElementById('input-nama');
        const inputSekolah = document.getElementById('input-sekolah');
        const inputProdi = document.getElementById('input-prodi');
        const inputRegu = document.getElementById('input-regu');
        const scalePhoto = document.getElementById('scale-photo');
        const fontSizeSlider = document.getElementById('font-size');
        const uploadPhoto = document.getElementById('upload-photo');

        // Images
        const templateImg = new Image();
        templateImg.src = 'image.png'; // Merujuk langsung ke file template

        const userImg = new Image();
        
        // State Variabel
        let imgX = 0;
        let imgY = 0;
        let scale = 1;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // Inisialisasi Ukuran Canvas saat template dimuat
        templateImg.onload = () => {
            canvas.width = templateImg.width;
            canvas.height = templateImg.height;
            drawCanvas();
        };

        templateImg.onerror = () => {
            alert("Gagal memuat image.png. Pastikan file image.png ada di folder yang sama!");
        };

        // Fungsi menggambar seluruh komponen ke Canvas
        function drawCanvas() {
            if (!templateImg.complete) return;

            // Bersihkan kanvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Gambar Foto User (Di Bawah Template)
            if (userImg.src && userImg.complete) {
                const drawWidth = userImg.width * scale;
                const drawHeight = userImg.height * scale;
                ctx.drawImage(userImg, imgX, imgY, drawWidth, drawHeight);
            }

            // 2. Gambar Template
            ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);

            // 3. Gambar Teks
            const fontSize = fontSizeSlider.value;
            ctx.font = `bold ${fontSize}px "Segoe UI", Arial, sans-serif`;
            ctx.fillStyle = "#000000"; // Warna teks hitam
            ctx.textBaseline = "middle";

            // Kordinat X dan Y disesuaikan dengan proporsi template (Estimasi)
            const textX = canvas.width * 0.38; // Posisi sebelah kanan titik dua (:)
            const namaY = canvas.height * 0.686;
            const sekolahY = canvas.height * 0.723;
            const prodiY = canvas.height * 0.762;
            const reguY = canvas.height * 0.800;

            ctx.fillText(inputNama.value, textX, namaY);
            ctx.fillText(inputSekolah.value, textX, sekolahY);
            ctx.fillText(inputProdi.value, textX, prodiY);
            ctx.fillText(inputRegu.value, textX, reguY);
        }

        // --- Event Listeners ---

        // Mengunggah Foto
        uploadPhoto.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    userImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Saat foto berhasil dimuat
        userImg.onload = () => {
            // Tengahkan foto secara default
            scale = canvas.width / userImg.width;
            if (userImg.height * scale < canvas.height) {
                scale = canvas.height / userImg.height;
            }
            scalePhoto.value = scale;
            imgX = (canvas.width - (userImg.width * scale)) / 2;
            imgY = (canvas.height - (userImg.height * scale)) / 2;
            drawCanvas();
        };

        // Slider Zoom Foto
        scalePhoto.addEventListener('input', (e) => {
            scale = parseFloat(e.target.value);
            drawCanvas();
        });

        // Slider Ukuran Font
        fontSizeSlider.addEventListener('input', drawCanvas);

        // Fitur Geser (Drag) Foto di Canvas
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            // Menyesuaikan rasio tampilan canvas dengan ukuran aslinya
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            startX = (e.clientX - rect.left) * scaleX - imgX;
            startY = (e.clientY - rect.top) * scaleY - imgY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            imgX = mouseX - startX;
            imgY = mouseY - startY;
            drawCanvas();
        });

        canvas.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; });

        // Mendukung layar sentuh (Touch) untuk HP
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            startX = (e.touches[0].clientX - rect.left) * scaleX - imgX;
            startY = (e.touches[0].clientY - rect.top) * scaleY - imgY;
        }, {passive: true});

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const touchX = (e.touches[0].clientX - rect.left) * scaleX;
            const touchY = (e.touches[0].clientY - rect.top) * scaleY;

            imgX = touchX - startX;
            imgY = touchY - startY;
            drawCanvas();
            e.preventDefault(); // Mencegah scroll saat menggeser foto
        }, {passive: false});

        canvas.addEventListener('touchend', () => { isDragging = false; });

        // --- Fungsi Unduh ---
        function downloadImage() {
            if (!templateImg.complete) {
                alert("Template belum termuat sempurna.");
                return;
            }
            const link = document.createElement('a');
            link.download = 'Twibbon-PKKMB-' + (inputNama.value || '2026') + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
